# GitHub Actions build matrix. See
# https://zmk.dev/docs/development/hardware-integration/new-shield
#
# One build: the PCB is a unibody with a single XIAO. The XIAO nRF52840 "Plus"
# uses the same board name as the standard XIAO BLE; the extra pads are plain
# GPIOs referenced from the shield overlay.
---
include:
  - board: seeeduino_xiao_ble
    shield: rara_avia
    artifact-name: rara_avia
