# Shield-local Kconfig defaults.
#
# ROW 0 (D14 / P0.09) and COLUMN 1 (D15 / P0.10) are the nRF52840's NFCT
# antenna pins. Without this they stay allocated to NFC and both matrix lines
# read as permanently idle.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Battery reporting is disabled in rara_avia.overlay: COLUMN 3 is wired to
# D16 / P0.31, which is the XIAO board's battery divider tap (AIN7).

# Uncomment to enable the encoder once A/B are wired (A = D0, B = D19).
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
